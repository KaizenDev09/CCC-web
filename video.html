<!DOCTYPE html>
<html lang="en" class="other">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <style>
    .portrait-video-container {
      position: relative;
      max-width: 360px; /* Better size for portrait video */
      margin: 0 auto;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    }
    
    .portrait-video-container iframe {
      width: 100%;
      height: 640px; /* Taller height for portrait */
      border: none;
    }
    
    @media (max-width: 480px) {
      .portrait-video-container {
        max-width: 300px;
      }
      
      .portrait-video-container iframe {
        height: 533px; /* Adjust height for mobile */
      }
    }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to content</a>
  
  <header class="fade-down">
    <div class="logo-container">
      <img src="logo.png" alt="Rain Manlangit Logo" class="site-logo" width="40" height="40">
      <h1 class="logo">Rain Manlangit</h1>
    </div>
    <nav aria-label="Main navigation">
      <a href="index.html" class="nav-button">Home</a>
      <a href="audio.html" class="nav-button">Audio</a>
    </nav>
  </header>

  <main id="main-content">
    <section class="content-section fade-up">
      <h2>My Vlog</h2>
      <div class="portrait-video-container">
        <iframe src="https://drive.google.com/file/d/1PcMSgDHQsjAAhRvn9cVA0fItdpMXwUwA/preview" 
        width="640" height="480" allow="autoplay" allowfullscreen></iframe>
      </div>
      <br><br>
      <a href="index.html" class="back-button">Back to Home</a>
    </section>
  </main>

  <footer class="fade-up">
    <p>©Rain Manlangit MAWD103</p>
  </footer>
</body>
</html>
